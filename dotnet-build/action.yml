name: '.NET Build'
description: 'Build .NET solutions using MSBuild/dotnet build'
author: 'GitHub Actions Migration Agent'

inputs:
  solution:
    description: 'Path to solution file'
    required: true
  configuration:
    description: 'Build configuration (Debug/Release)'
    required: true
  platform:
    description: 'Target platform'
    required: true
  vs-version:
    description: 'Visual Studio version'
    required: false
    default: 'latest'
  clean:
    description: 'Clean before build'
    required: false
    default: 'false'
  restore-packages:
    description: 'Restore NuGet packages before build'
    required: false
    default: 'false'

outputs:
  build-status:
    description: 'Success/Failure status'
    value: ${{ steps.build.outputs.build-status }}
  build-output-path:
    description: 'Path to build outputs'
    value: ${{ steps.build.outputs.build-output-path }}

runs:
  using: 'composite'
  steps:
    - name: Build .NET solution
      id: build
      shell: bash
      run: |
        echo "Starting .NET build for ${{ inputs.solution }}"
        
        # Set build output path
        build_output_path="${{ github.workspace }}/bin/${{ inputs.configuration }}"
        echo "build-output-path=$build_output_path" >> $GITHUB_OUTPUT
        
        # Clean if requested
        if [ "${{ inputs.clean }}" = "true" ]; then
          echo "Cleaning solution..."
          dotnet clean "${{ inputs.solution }}" --configuration "${{ inputs.configuration }}"
        fi
        
        # Restore packages if requested
        if [ "${{ inputs.restore-packages }}" = "true" ]; then
          echo "Restoring packages..."
          dotnet restore "${{ inputs.solution }}"
        fi
        
        # Build the solution
        echo "Building solution with configuration: ${{ inputs.configuration }}, platform: ${{ inputs.platform }}"
        
        if dotnet build "${{ inputs.solution }}" \
          --configuration "${{ inputs.configuration }}" \
          --no-restore \
          --verbosity normal; then
          echo "build-status=success" >> $GITHUB_OUTPUT
          echo "Build completed successfully"
        else
          echo "build-status=failure" >> $GITHUB_OUTPUT
          echo "Build failed"
          exit 1
        fi
        