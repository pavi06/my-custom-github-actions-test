name: '.NET Test'
description: 'Execute .NET tests using VSTest/dotnet test'
author: 'GitHub Actions Migration Agent'

inputs:
  configuration:
    description: 'Build configuration'
    required: true
  platform:
    description: 'Target platform'
    required: true
  test-assembly-pattern:
    description: 'Pattern for test assemblies'
    required: true
  exclude-pattern:
    description: 'Exclusion pattern for test files'
    required: false
    default: ''
  results-folder:
    description: 'Test results output folder'
    required: false
    default: 'TestResults'
  run-in-parallel:
    description: 'Run tests in parallel'
    required: false
    default: 'false'
  code-coverage:
    description: 'Enable code coverage'
    required: false
    default: 'false'

outputs:
  test-results:
    description: 'Test execution results'
    value: ${{ steps.test.outputs.test-results }}
  tests-passed:
    description: 'Number of tests passed'
    value: ${{ steps.test.outputs.tests-passed }}
  tests-failed:
    description: 'Number of tests failed'
    value: ${{ steps.test.outputs.tests-failed }}

runs:
  using: 'composite'
  steps:
    - name: Run .NET tests
      id: test
      shell: bash
      run: |
        echo "Starting .NET test execution"
        
        # Create results folder
        results_folder="${{ inputs.results-folder }}"
        mkdir -p "$results_folder"
        
        # Find test assemblies
        echo "Searching for test assemblies with pattern: ${{ inputs.test-assembly-pattern }}"
        
        # Build find command for test assemblies
        find_cmd="find ${{ github.workspace }} -name '*.dll' -path '*${{ inputs.configuration }}*' -name '*test*'"
        
        if [ -n "${{ inputs.exclude-pattern }}" ]; then
          # Remove the '!' prefix if present and add exclusion
          exclude_pattern="${{ inputs.exclude-pattern }}"
          exclude_pattern="${exclude_pattern#!}"
          find_cmd="$find_cmd ! -path '*$exclude_pattern*'"
        fi
        
        echo "Find command: $find_cmd"
        test_assemblies=$(eval $find_cmd)
        
        if [ -z "$test_assemblies" ]; then
          echo "No test assemblies found"
          echo "test-results=no-tests" >> $GITHUB_OUTPUT
          echo "tests-passed=0" >> $GITHUB_OUTPUT
          echo "tests-failed=0" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        echo "Found test assemblies:"
        echo "$test_assemblies"
        
        # Build dotnet test command
        test_cmd="dotnet test"
        test_cmd="$test_cmd --configuration ${{ inputs.configuration }}"
        test_cmd="$test_cmd --logger trx --results-directory $results_folder"
        test_cmd="$test_cmd --no-build --no-restore"
        
        if [ "${{ inputs.run-in-parallel }}" = "true" ]; then
          test_cmd="$test_cmd --parallel"
        fi
        
        if [ "${{ inputs.code-coverage }}" = "true" ]; then
          test_cmd="$test_cmd --collect:'XPlat Code Coverage'"
        fi
        
        # Run tests for each assembly
        total_passed=0
        total_failed=0
        overall_result="success"
        
        for assembly in $test_assemblies; do
          echo "Running tests for: $assembly"
          
          if eval "$test_cmd \"$assembly\""; then
            echo "Tests passed for $assembly"
          else
            echo "Tests failed for $assembly"
            overall_result="failure"
          fi
        done
        
        # Parse test results from TRX files
        if [ -d "$results_folder" ]; then
          for trx_file in "$results_folder"/*.trx; do
            if [ -f "$trx_file" ]; then
              passed=$(grep -o 'passed="[0-9]*"' "$trx_file" | grep -o '[0-9]*' || echo "0")
              failed=$(grep -o 'failed="[0-9]*"' "$trx_file" | grep -o '[0-9]*' || echo "0")
              total_passed=$((total_passed + passed))
              total_failed=$((total_failed + failed))
            fi
          done
        fi
        
        echo "test-results=$overall_result" >> $GITHUB_OUTPUT
        echo "tests-passed=$total_passed" >> $GITHUB_OUTPUT
        echo "tests-failed=$total_failed" >> $GITHUB_OUTPUT
        
        echo "Test execution completed. Passed: $total_passed, Failed: $total_failed"
        
        if [ "$overall_result" = "failure" ]; then
          exit 1
        fi