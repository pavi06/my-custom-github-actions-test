name: 'dotnet-test'
description: 'Execute unit tests for .NET projects'
author: 'GitHub Actions Migration Agent'

inputs:
  projects:
    description: 'Glob pattern for test project files (e.g., "**/*Tests/*.csproj")'
    required: true
  configuration:
    description: 'Test configuration (e.g., "Release", "Debug")'
    required: true
  working-directory:
    description: 'Working directory for the operation'
    required: false
    default: '.'
  verbosity:
    description: 'Verbosity level'
    required: false
    default: 'minimal'
  no-build:
    description: 'Skip building before testing'
    required: false
    default: 'false'
  collect-coverage:
    description: 'Collect code coverage'
    required: false
    default: 'false'
  logger:
    description: 'Test logger format'
    required: false
    default: 'console'

outputs:
  success:
    description: 'Boolean indicating if all tests passed'
    value: ${{ steps.test-step.outputs.success }}
  tests-total:
    description: 'Total number of tests executed'
    value: ${{ steps.test-step.outputs.tests-total }}
  tests-passed:
    description: 'Number of tests that passed'
    value: ${{ steps.test-step.outputs.tests-passed }}
  tests-failed:
    description: 'Number of tests that failed'
    value: ${{ steps.test-step.outputs.tests-failed }}
  tests-skipped:
    description: 'Number of tests that were skipped'
    value: ${{ steps.test-step.outputs.tests-skipped }}
  coverage-report-path:
    description: 'Path to coverage report (if enabled)'
    value: ${{ steps.test-step.outputs.coverage-report-path }}

runs:
  using: 'composite'
  steps:
    - name: Execute .NET tests
      id: test-step
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        $projects = "${{ inputs.projects }}"
        $configuration = "${{ inputs.configuration }}"
        $verbosity = "${{ inputs.verbosity }}"
        $noBuild = "${{ inputs.no-build }}"
        $collectCoverage = "${{ inputs.collect-coverage }}"
        $logger = "${{ inputs.logger }}"
        
        Write-Host "Starting .NET test operation..."
        Write-Host "Projects pattern: $projects"
        Write-Host "Configuration: $configuration"
        Write-Host "Verbosity: $verbosity"
        Write-Host "No build: $noBuild"
        Write-Host "Collect coverage: $collectCoverage"
        Write-Host "Logger: $logger"
        
        # Build dotnet test command
        $testArgs = @("test")
        
        if ($projects) {
            # Find matching test project files
            $testFiles = Get-ChildItem -Path . -Filter "*.csproj" -Recurse | Where-Object { 
                ($_.FullName -like "*$projects*" -or $projects -eq "**/*Tests/*.csproj") -and
                ($_.Name -like "*Test*" -or $_.Directory.Name -like "*Test*")
            }
            
            if ($testFiles.Count -eq 0) {
                Write-Host "No test project files found matching pattern: $projects"
                echo "success=false" >> $env:GITHUB_OUTPUT
                echo "tests-total=0" >> $env:GITHUB_OUTPUT
                echo "tests-passed=0" >> $env:GITHUB_OUTPUT
                echo "tests-failed=0" >> $env:GITHUB_OUTPUT
                echo "tests-skipped=0" >> $env:GITHUB_OUTPUT
                echo "coverage-report-path=" >> $env:GITHUB_OUTPUT
                exit 1
            }
            
            Write-Host "Found $($testFiles.Count) test project file(s)"
            foreach ($file in $testFiles) {
                Write-Host "  - $($file.FullName)"
            }
        }
        
        # Add configuration
        if ($configuration) {
            $testArgs += "--configuration", $configuration
        }
        
        # Add verbosity
        if ($verbosity -ne "minimal") {
            $testArgs += "--verbosity", $verbosity
        }
        
        # Add no-build option
        if ($noBuild -eq "true") {
            $testArgs += "--no-build"
        }
        
        # Add logger
        if ($logger -ne "console") {
            $testArgs += "--logger", $logger
        }
        
        # Add coverage collection
        $coverageReportPath = ""
        if ($collectCoverage -eq "true") {
            $testArgs += "--collect", "XPlat Code Coverage"
            $coverageReportPath = "./TestResults"
        }
        
        # Add projects pattern
        if ($projects) {
            $testArgs += $projects
        }
        
        Write-Host "Executing: dotnet $($testArgs -join ' ')"
        
        try {
            # Execute dotnet test
            $output = & dotnet @testArgs 2>&1
            $exitCode = $LASTEXITCODE
            
            Write-Host $output
            
            # Parse test results from output
            $testsTotal = 0
            $testsPassed = 0
            $testsFailed = 0
            $testsSkipped = 0
            
            # Parse different output formats
            if ($output -match "Total tests: (\d+)") {
                $testsTotal = [int]$matches[1]
            }
            
            if ($output -match "Passed: (\d+)") {
                $testsPassed = [int]$matches[1]
            }
            
            if ($output -match "Failed: (\d+)") {
                $testsFailed = [int]$matches[1]
            }
            
            if ($output -match "Skipped: (\d+)") {
                $testsSkipped = [int]$matches[1]
            }
            
            # Alternative parsing for different output format
            if ($output -match "(\d+) passed, (\d+) failed, (\d+) skipped") {
                $testsPassed = [int]$matches[1]
                $testsFailed = [int]$matches[2]
                $testsSkipped = [int]$matches[3]
                $testsTotal = $testsPassed + $testsFailed + $testsSkipped
            }
            
            if ($exitCode -eq 0) {
                Write-Host "✅ All tests passed successfully"
                Write-Host "Total: $testsTotal, Passed: $testsPassed, Failed: $testsFailed, Skipped: $testsSkipped"
                
                echo "success=true" >> $env:GITHUB_OUTPUT
                echo "tests-total=$testsTotal" >> $env:GITHUB_OUTPUT
                echo "tests-passed=$testsPassed" >> $env:GITHUB_OUTPUT
                echo "tests-failed=$testsFailed" >> $env:GITHUB_OUTPUT
                echo "tests-skipped=$testsSkipped" >> $env:GITHUB_OUTPUT
                echo "coverage-report-path=$coverageReportPath" >> $env:GITHUB_OUTPUT
            } else {
                Write-Host "❌ Tests failed with exit code: $exitCode"
                Write-Host "Total: $testsTotal, Passed: $testsPassed, Failed: $testsFailed, Skipped: $testsSkipped"
                
                echo "success=false" >> $env:GITHUB_OUTPUT
                echo "tests-total=$testsTotal" >> $env:GITHUB_OUTPUT
                echo "tests-passed=$testsPassed" >> $env:GITHUB_OUTPUT
                echo "tests-failed=$testsFailed" >> $env:GITHUB_OUTPUT
                echo "tests-skipped=$testsSkipped" >> $env:GITHUB_OUTPUT
                echo "coverage-report-path=$coverageReportPath" >> $env:GITHUB_OUTPUT
                exit $exitCode
            }
        } catch {
            Write-Host "❌ Error during test execution: $($_.Exception.Message)"
            echo "success=false" >> $env:GITHUB_OUTPUT
            echo "tests-total=0" >> $env:GITHUB_OUTPUT
            echo "tests-passed=0" >> $env:GITHUB_OUTPUT
            echo "tests-failed=0" >> $env:GITHUB_OUTPUT
            echo "tests-skipped=0" >> $env:GITHUB_OUTPUT
            echo "coverage-report-path=" >> $env:GITHUB_OUTPUT
            exit 1
        }

branding:
  icon: 'check-circle'
  color: 'purple'